name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  check:
    name: Lint and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      # Misma versión con la que se genera pnpm-lock.yaml (y la de los CI de Backend y Frontend):
      # pnpm 9 no lee los overrides de pnpm-workspace.yaml y rechaza el lockfile
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      # pnpm 11 exige Node 22.13 o superior
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run Linter
        run: pnpm run lint

      - name: 🏷️ Run Typecheck
        run: pnpm exec tsc --noEmit
